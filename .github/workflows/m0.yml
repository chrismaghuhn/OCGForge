name: M0 native conformance

on:
  push:
  pull_request:

jobs:
  m0:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Verify Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch exact rules bundle
        run: |
          python tools/fetch_rules_bundle.py \
            --lock third_party/rules_bundle.lock.json \
            --cache .cache/rules_bundle

      - name: Verify exact rules bundle
        run: |
          python tools/verify_rules_bundle.py \
            --lock third_party/rules_bundle.lock.json \
            --cache .cache/rules_bundle

      - name: Run rules-bundle unit tests
        run: python -m unittest discover -s tests/python -v

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev --parallel

      - name: Run CTest conformance
        run: ctest --preset dev

      - name: Run controlled duel smoke test
        run: |
          mkdir --parents artifacts
          build/dev/ygo_core_probe \
            --max-steps 1000 \
            --output artifacts/controlled-duel-trace.jsonl

      - name: Run independent-process determinism test
        run: |
          python tests/determinism/determinism_test.py \
            --probe build/dev/ygo_core_probe

      - name: Run hidden-information test
        run: ctest --test-dir build/dev --output-on-failure \
          --tests-regex 'player_view_test'

      - name: Check generated lock artifacts
        run: |
          git diff --check
          git diff --exit-code -- third_party/rules_bundle.lock.json

      - name: Upload minimal diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: m0-diagnostics
          if-no-files-found: ignore
          path: |
            artifacts/*.jsonl
            build/dev/CMakeFiles/CMakeOutput.log
            build/dev/CMakeFiles/CMakeError.log
            build/dev/Testing/Temporary/LastTest.log
