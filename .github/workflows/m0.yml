name: M1 Windows native conformance (M0 gate)

on:
  push:
  pull_request:

jobs:
  m0:
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress --yes

      - name: Verify Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch exact rules bundle
        shell: pwsh
        run: python tools/fetch_rules_bundle.py --lock third_party/rules_bundle.lock.json --cache .cache/rules_bundle

      - name: Verify exact rules bundle
        shell: pwsh
        run: python tools/verify_rules_bundle.py --lock third_party/rules_bundle.lock.json --cache .cache/rules_bundle

      - name: Run rules-bundle unit tests
        shell: pwsh
        run: python -m unittest discover -s tests/python -v

      - name: Verify M1 decision coverage inventory
        shell: pwsh
        run: python tests/protocol/decision_coverage_test.py

      - name: Verify M2 observation coverage inventories
        shell: pwsh
        run: python tests/observation/observation_coverage_test.py

      - name: Configure
        shell: pwsh
        run: cmake --preset dev-windows

      - name: Build
        shell: pwsh
        run: cmake --build --preset dev-windows --parallel

      - name: Run CTest conformance
        shell: pwsh
        run: ctest --preset dev-windows --output-on-failure

      - name: Run controlled duel smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          .\build\dev-windows\ygo_core_probe.exe --max-steps 1000 --output artifacts\m1-controlled-duel-trace.jsonl

      - name: Run independent-process determinism test
        shell: pwsh
        run: python tests/determinism/determinism_test.py --probe build/dev-windows/ygo_core_probe.exe

      - name: Run hidden-information test
        shell: pwsh
        run: ctest --test-dir build/dev-windows --output-on-failure --tests-regex player_view_test

      - name: Run M2 observation probe determinism
        shell: pwsh
        run: |
          .\build\dev-windows\ygo_observation_probe.exe --fixture m2 --seed 123 --player 0 --output artifacts\m2-observation-a.json
          .\build\dev-windows\ygo_observation_probe.exe --fixture m2 --seed 123 --player 0 --output artifacts\m2-observation-b.json
          if ((Get-FileHash artifacts\m2-observation-a.json).Hash -ne (Get-FileHash artifacts\m2-observation-b.json).Hash) { throw "same-seed player-0 observations differ" }
          .\build\dev-windows\ygo_observation_probe.exe --fixture m2 --seed 123 --player 1 --output artifacts\m2-observation-player1.json

      - name: Check generated lock artifacts
        shell: pwsh
        run: |
          git diff --check
          git diff --exit-code -- third_party/rules_bundle.lock.json

      - name: Upload minimal diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: m1-diagnostics
          if-no-files-found: ignore
          path: |
            artifacts/*.jsonl
            build/dev-windows/CMakeFiles/CMakeOutput.log
            build/dev-windows/CMakeFiles/CMakeError.log
            build/dev-windows/Testing/Temporary/LastTest.log
